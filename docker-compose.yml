services:
  db:
    image: postgres:latest
    container_name: pg
    hostname: postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - 5434:5432
    volumes:
      - pgdata:/var/lib/postgresql
  airflow:                       
    build: ./airflow
    container_name: airflow      
    hostname: airflow           
    user: "${AIRFLOW_UID:-50000}:0"
    command: airflow standalone
    environment:
      PYTHONPATH: /opt/airflow
      AIRFLOW_VAR_TYPESAFE_AI_API_KEY: ${TYPESAFE_AI_API_KEY}
      AIRFLOW_CONN_BILLBOARD_POSTGRES: >-
        {"conn_type": "postgres", "host": "pg", "port": 5432,
        "login": "${DB_USER}", "password": "${DB_PASSWORD}",
        "schema": "${DB_DATABASE}"}
    ports:
      - 8080:8080                
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs 
      - ./data:/opt/airflow/data
      - ./services:/opt/airflow/services
      - ./sql:/opt/airflow/sql

volumes:
  pgdata:
